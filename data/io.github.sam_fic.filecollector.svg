<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <filter id="softShadowOnly" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.2"/>
      </feComponentTransfer>
    </filter>
    <clipPath id="panelClip">
      <rect x="8" y="24" width="112" height="88" rx="8" ry="8"/>
    </clipPath>
    <linearGradient id="cornerHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#62a0ea;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#62a0ea;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#62a0ea;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="orangeHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffbe6f;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#ffbe6f;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#ffbe6f;stop-opacity:0"/>
    </linearGradient>
    <filter id="cornerBlur" x="-20%" y="-10%" width="140%" height="120%">
      <feGaussianBlur stdDeviation="2 0"/>
    </filter>
    <linearGradient id="pageGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a5fb4"/>
      <stop offset="100%" style="stop-color:#1c71d8"/>
    </linearGradient>
    <linearGradient id="panelGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a5fb4"/>
      <stop offset="100%" style="stop-color:#3584e4"/>
    </linearGradient>
    <clipPath id="darkRectClip">
      <rect x="8" y="32" width="112" height="88" rx="8" ry="8"/>
    </clipPath>
    <clipPath id="orangeShadowClip">
      <rect x="28" y="16" width="72" height="16" rx="2" ry="2"/>
    </clipPath>
  </defs>
  <rect x="8" y="32" width="112" height="88" rx="8" ry="8" fill="#1a5fb4"/>
  <rect x="8" y="30" width="112" height="88" rx="8" ry="8" fill="url(#pageGradient)"/>
  <rect x="8" y="28" width="112" height="88" rx="8" ry="8" fill="#1a5fb4"/>
  <rect x="8" y="26" width="112" height="88" rx="8" ry="8" fill="url(#pageGradient)"/>
  <g clip-path="url(#darkRectClip)" filter="url(#cornerBlur)">
    <rect x="8" y="32" width="10" height="88" fill="url(#cornerHighlight)"/>
    <rect x="110" y="32" width="10" height="88" fill="url(#cornerHighlight)"/>
  </g>
  <rect x="8" y="24" width="112" height="88" rx="8" ry="8" fill="#3584e4"/>
  <rect x="8" y="24" width="112" height="20" rx="8" ry="8" fill="#1a5fb4"/>
  <rect x="8" y="36" width="112" height="8" fill="#1a5fb4"/>
  <g clip-path="url(#panelClip)">
    <rect x="28" y="18" width="72" height="16" rx="4" ry="4" fill="#c64600"/>
  </g>
  <g clip-path="url(#orangeShadowClip)" filter="url(#cornerBlur)">
    <rect x="28" y="16" width="2" height="16" fill="url(#orangeHighlight)"/>
    <rect x="98" y="16" width="2" height="16" fill="url(#orangeHighlight)"/>
  </g>
  <rect x="28" y="16" width="72" height="16" rx="4" ry="4" fill="#ffa348"/>
  <line x1="28" y1="62" x2="100" y2="62" stroke="#99c1f1" stroke-width="2" stroke-linecap="round"/>
  <line x1="28" y1="74" x2="90" y2="74" stroke="#99c1f1" stroke-width="2" stroke-linecap="round"/>
  <line x1="28" y1="86" x2="80" y2="86" stroke="#99c1f1" stroke-width="2" stroke-linecap="round"/>
  <g clip-path="url(#panelClip)">
    <circle cx="92" cy="86" r="19" fill="#1c71d8"/>
  </g>
  <circle cx="92" cy="84" r="18" fill="#33d17a" stroke="#fff" stroke-width="2"/>
  <path d="M86 84 l4 4 l8 -8" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>