# vala-lint 配置
#
# 项目代码风格遵循 elementary Code-Style guidelines (snake_case 方法/变量、
# PascalCase 类名、ALL_CAPS 常量), 由 io.elementary.vala-lint 工具校验.
#
# 用法:
#   io.elementary.vala-lint -c vala-lint.conf src/
#   io.elementary.vala-lint -c vala-lint.conf --fix src/  # 自动修复部分问题
#
# 在 CI 中作为关卡 (见 .github/workflows/*.yml). 等级:
#   error = 触发非零退出码 (CI 失败)
#   warn  = 仅打印, 不影响退出码
#   off   = 完全关闭
#
# 项目现状说明:
#   - line-length 设为 warn 而非 error, 因为 AI 提示词/中文注释/URL 行常超 120 字符,
#     设为 error 会立刻阻塞 CI; 后续可逐步收紧.
#   - ellipsis 暂设 warn: 现存约 25 处 UI 字符串以 "..." 结尾 (属于可翻译 msgid),
#     直接改写为 "…" 会触发 .pot/.po 全量重同步与翻译复核, 待统一字符串清理后再升为 error.
#   - 其他规则沿用 elementary 默认 (error), 与现有代码风格一致.

[Checks]
block-opening-brace-space-before=error
double-semicolon=error
double-spaces=error
ellipsis=warn
line-length=warn
naming-convention=error
no-space=error
note=warn
space-before-paren=error
use-of-tabs=error
trailing-newlines=error
trailing-whitespace=error
unnecessary-string-template=error

[Disabler]
disable-by-inline-comments=true

[line-length]
max-line-length=120
ignore-comments=true

[naming-convention]
# 全大写标识符 (Vala 常量约定) 不算违反 naming-convention
exceptions=MAX_FILE_CONTENT_SIZE,MAX_FILE_SIZE,PEEK_SIZE,HICOLOR_RESOURCE_PREFIX,DOCUMENT_EXTENSIONS,IMAGE_EXTENSIONS,SNAPSHOT_ICON_CHOICES

[note]
keywords=TODO,FIXME,XXX,HACK
