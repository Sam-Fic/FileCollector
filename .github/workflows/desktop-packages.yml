name: Desktop packages

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (vala-lint)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libjson-glib-dev \
            libvala-0.56-dev \
            meson \
            ninja-build \
            valac

      # 固定 tag 构建, 避免上游 master 变动导致规则漂移;
      # 在源码目录内执行 setup (老版 meson 不支持 "setup <builddir> <sourcedir>" 双位置参数)
      - name: Build vala-lint
        run: |
          git clone --depth 1 --branch 0.1.0 https://github.com/vala-lang/vala-lint.git /tmp/vala-lint
          cd /tmp/vala-lint
          meson setup build --buildtype=release
          meson compile -C build src/io.elementary.vala-lint

      - name: Run vala-lint
        run: /tmp/vala-lint/build/src/io.elementary.vala-lint -c vala-lint.conf src/

  deb:
    name: Build DEB (amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # 复用上次下载的 .deb。apt 归档里已有同版本包时不会重复拉取,
      # 官方源抖动时这一层缓存能兜住 (源不可用时 apt 才会真正报错)。
      - name: Cache apt package archives
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/apt-cache
          key: apt-cache-ubuntu-26.04-v1
          restore-keys: apt-cache-ubuntu-26.04-

      - name: Build and validate DEB package
        run: |
          mkdir -p "${RUNNER_TEMP}/apt-cache"
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --volume "${RUNNER_TEMP}/apt-cache:/var/cache/apt/archives" \
            --workdir /workspace \
            --env DEBIAN_FRONTEND=noninteractive \
            ubuntu:26.04 \
            bash -euc '
              APT_OPTS="-o Acquire::Retries=3 \
                        -o Acquire::http::Timeout=20 \
                        -o Acquire::https::Timeout=20 \
                        -o Acquire::Queue-Mode=access \
                        -o Acquire::ForceIPv4=true \
                        -o Acquire::Languages=none \
                        -o Binary::apt::APT::Keep-Downloaded-Packages=true"

              # archive.ubuntu.com 在部分时段劣化 (实测串行下载 349 个包耗 23
              # 分钟, 单包空等 95s)。GitHub runner 本身就跑在 Azure 上, 换
              # Azure CDN 镜像通常快一个数量级; 保留 Canonical 主站作为兜底
              # 源, 主源缺包时 apt 会自动去备源取。
              cp /etc/apt/sources.list.d/ubuntu.sources \
                 /etc/apt/sources.list.d/ubuntu-fallback.sources
              sed -i "s|http://archive.ubuntu.com/ubuntu/|http://azure.archive.ubuntu.com/ubuntu/|g" \
                /etc/apt/sources.list.d/ubuntu.sources

              apt-get ${APT_OPTS} update
              apt-get ${APT_OPTS} install -y --no-install-recommends \
                build-essential \
                ca-certificates \
                dpkg-dev \
                gettext \
                libadwaita-1-dev \
                libcmark-gfm-dev \
                libcmark-gfm-extensions-dev \
                libgee-0.8-dev \
                libgtk-4-dev \
                libgtksourceview-5-dev \
                libjson-glib-dev \
                libsecret-1-dev \
                libsoup-3.0-dev \
                meson \
                ninja-build \
                pkg-config \
                python3 \
                valac \
                blueprint-compiler

              # 容器内以 root 运行, 归档目录要放开权限才能被 runner 用户
              # (actions/cache) 读取保存
              chmod -R a+rwX /var/cache/apt/archives

              chmod +x tools/build-deb.sh
              tools/build-deb.sh
            '

      - name: Upload DEB package
        uses: actions/upload-artifact@v4
        with:
          name: filecollector-deb-amd64
          path: |
            dist/*.deb
            dist/*.deb.sha256
          if-no-files-found: error

  flatpak:
    name: Build Flatpak (x86_64)
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Read application version
        id: version
        shell: bash
        run: |
          version="$(sed -n "s/^[[:space:]]*version:[[:space:]]*'\([^']*\)'.*/\1/p" meson.build | head -n 1)"
          test -n "${version}"
          echo "value=${version}" >> "$GITHUB_OUTPUT"

      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: filecollector-${{ steps.version.outputs.value }}.flatpak
          manifest-path: io.github.sam_fic.filecollector.json
          cache-key: flatpak-builder-${{ github.sha }}
          arch: x86_64
          run-tests: true
          verbose: true

  windows:
    name: Build Windows portable ZIP (x64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-blueprint-compiler
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-gtksourceview5
            mingw-w64-ucrt-x86_64-json-glib
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-libgee
            mingw-w64-ucrt-x86_64-libsecret
            mingw-w64-ucrt-x86_64-libsoup3
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-vala
            unzip
            zip

      - name: Build and validate Windows portable package
        run: |
          chmod +x tools/build-windows-package.sh
          tools/build-windows-package.sh

      - name: Upload Windows portable package
        uses: actions/upload-artifact@v4
        with:
          name: filecollector-windows-x64
          path: |
            dist/filecollector-windows-*-x64.zip
            dist/filecollector-windows-*-x64.zip.sha256
          if-no-files-found: error

  # 可选的 LibreOffice 转换器包 (Office→PDF 视觉转换链路): 主包体积不变,
  # 用户按需下载解压到便携包根目录。LO_VERSION 固定于脚本内, 升级时手动更新。
  # PR 不构建 (350MB 下载纯耗时); main/tag 上构建, tag 时随 Release 发布。
  converter-package:
    name: Build Windows LibreOffice converter package
    runs-on: windows-latest
    if: github.event_name != 'pull_request'
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            unzip
            zip

      - name: Build LibreOffice converter package
        run: |
          chmod +x tools/build-converter-package.sh
          tools/build-converter-package.sh

      # 只校验 zip 清单是不够的: 曾经出现过"包能打出来、清单也过, 但 LibreOffice
      # 起不来"的回归 (staging 漏了根目录的 presets/ 启动必需项)。
      # 这里真跑一次 docx -> PDF 转换, 把这类问题挡在 CI。
      - name: Smoke test converter package
        run: |
          chmod +x tools/verify-converter-package.sh
          tools/verify-converter-package.sh

      - name: Upload converter package
        uses: actions/upload-artifact@v4
        with:
          name: filecollector-windows-converter-x64
          path: |
            dist/filecollector-converter-windows-x64-*.zip
            dist/filecollector-converter-windows-x64-*.zip.sha256
          if-no-files-found: error

  macos:
    name: Build macOS app bundle (ARM64)
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build and validate macOS application package
        run: |
          chmod +x tools/build-macos-package.sh
          tools/build-macos-package.sh

      - name: Upload macOS application package
        uses: actions/upload-artifact@v4
        with:
          name: filecollector-macos-arm64
          path: |
            dist/filecollector-macos-*-arm64.zip
            dist/filecollector-macos-*-arm64.zip.sha256
          if-no-files-found: error

  publish:
    name: Publish desktop packages
    needs: [lint, deb, flatpak, windows, macos, converter-package]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Extract release version
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download DEB package
        uses: actions/download-artifact@v4
        with:
          name: filecollector-deb-amd64
          path: release-assets

      - name: Download Flatpak bundle
        uses: actions/download-artifact@v4
        with:
          name: filecollector-${{ steps.version.outputs.value }}-x86_64.flatpak
          path: release-assets

      - name: Download Windows package
        uses: actions/download-artifact@v4
        with:
          name: filecollector-windows-x64
          path: release-assets

      - name: Download Windows converter package
        uses: actions/download-artifact@v4
        with:
          name: filecollector-windows-converter-x64
          path: release-assets

      - name: Download macOS package
        uses: actions/download-artifact@v4
        with:
          name: filecollector-macos-arm64
          path: release-assets

      - name: Verify release assets
        run: |
          find release-assets -maxdepth 1 -type f -printf '%f\n' | sort
          test "$(find release-assets -maxdepth 1 -name '*.deb' -type f | wc -l)" -eq 1
          test "$(find release-assets -maxdepth 1 -name '*.flatpak' -type f | wc -l)" -eq 1
          test "$(find release-assets -maxdepth 1 -name 'filecollector-windows-*-x64.zip' -type f | wc -l)" -eq 1
          test "$(find release-assets -maxdepth 1 -name 'filecollector-converter-windows-x64-*.zip' -type f | wc -l)" -eq 1
          test "$(find release-assets -maxdepth 1 -name 'filecollector-macos-*-arm64.zip' -type f | wc -l)" -eq 1
          test "$(find release-assets -maxdepth 1 -name '*.sha256' -type f | wc -l)" -eq 4

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: FileCollector ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
          fail_on_unmatched_files: true
