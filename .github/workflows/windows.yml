name: 🏁 Windows

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - name: Setup msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-gtk4
            mingw-w64-x86_64-libadwaita
            mingw-w64-x86_64-json-glib
            mingw-w64-x86_64-libsoup3
            mingw-w64-x86_64-libgee
            mingw-w64-x86_64-gtksourceview5
            mingw-w64-x86_64-cmark-gfm
            mingw-w64-x86_64-blueprint-compiler
            mingw-w64-x86_64-gettext
            mingw-w64-x86_64-libsecret

      - name: Build
        run: |
          meson setup build
          meson compile -C build

      - name: Stage portable package
        run: |
          mkdir -p staging/bin
          cp build/filecollector.exe staging/bin/
          python3 tools/collect_dlls.py staging/bin/filecollector.exe staging/bin
          mkdir -p staging/share
          cp -r data staging/share/ 2>/dev/null || true
          cp -r locale staging/ 2>/dev/null || true
          cd staging && zip -r ../filecollector-windows-x64.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: filecollector-windows-x64
          path: filecollector-windows-x64.zip
          if-no-files-found: error
